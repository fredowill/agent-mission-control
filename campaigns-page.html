<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campaigns &mdash; Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff;--bg2:#fafafa;--surface:#f4f4f5;--surface2:#e4e4e7;
  --text:#09090b;--text2:#52525b;--text3:#a1a1aa;--sep:#e4e4e7;
  --purple:#8b5cf6;--purple-bg:rgba(139,92,246,0.06);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,0.06);
  --green:#22c55e;--green-bg:rgba(34,197,94,0.06);
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,0.06);
  --rose:#ef4444;--rose-bg:rgba(239,68,68,0.05);
  --cyan:#06b6d4;--cyan-bg:rgba(6,182,212,0.06);
  --radius:12px;
}
body{background:var(--bg2);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,4vw,48px);height:64px;background:var(--bg);border-bottom:1px solid var(--sep);position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--purple)}
.logo-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:-0.02em}
.header-nav{display:flex;gap:2px;padding:3px;background:var(--surface);border-radius:8px;position:absolute;left:50%;transform:translateX(-50%)}
.nav-link{padding:5px 14px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text3);text-decoration:none;transition:all .15s;white-space:nowrap}
.nav-link:hover{color:var(--text2)}
.nav-link.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.header-right{display:flex;align-items:center;gap:8px}

/* Shell */
.shell{max-width:1200px;margin:0 auto;padding:32px 20px 60px}

/* ── Hero Card ── */
.hero{background:var(--bg);border:1px solid var(--sep);border-radius:16px;padding:0;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.hero-gradient{height:4px;background:linear-gradient(90deg,var(--purple),var(--blue),var(--cyan))}
.hero-inner{padding:32px 36px 28px}
.hero-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hero-status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 14px;border-radius:100px}
.hero-status.active{background:var(--green-bg);color:#16a34a}
.hero-status.active::before{content:'';width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 2s ease infinite}
.hero-status.retro{background:var(--amber-bg);color:#92400e}
.hero-status.done{background:var(--blue-bg);color:var(--blue)}
.hero-status.draft{background:rgba(139,92,246,0.1);color:#7c3aed}
.hero-status.setup{background:var(--purple-bg);color:var(--purple)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)}
.hero-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;font-weight:800;letter-spacing:-0.04em;line-height:1.2;margin-bottom:8px}
.hero-desc{font-size:14px;line-height:1.7;color:var(--text2);max-width:700px;margin-bottom:20px}

/* Hero Stats */
.hero-stats{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--sep);border-radius:12px;overflow:hidden;margin-bottom:20px}
.hero-stat{flex:1;min-width:100px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--sep);background:var(--bg)}
.hero-stat:last-child{border-right:none}
.hero-stat-value{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1}
.hero-stat-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.hero-stat.gpa .hero-stat-value{font-size:28px}
.stat-purple{color:var(--purple)}
.stat-green{color:var(--green)}
.stat-rose{color:var(--rose)}
.stat-amber{color:var(--amber)}
.stat-blue{color:var(--blue)}
.stat-text3{color:var(--text3)}

/* Hero Actions */
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Compact execution plan in hero */
.hero-exec{margin:20px 0 16px;background:var(--bg2);border:1px solid var(--sep);border-radius:10px;overflow:hidden}
.hero-exec-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:10px 16px 6px;display:flex;align-items:center;gap:8px}
.hero-exec-version{font-family:'DM Mono',monospace;font-size:9px;color:#7c3aed;background:rgba(139,92,246,0.08);padding:1px 6px;border-radius:4px}
.hero-exec-sprint-header{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:800;letter-spacing:-0.01em;color:var(--text);padding:12px 16px 6px;background:rgba(0,0,0,.02);border-top:1.5px solid var(--sep)}
.hero-exec-row{display:grid;grid-template-columns:24px 48px 1fr auto auto;align-items:center;gap:8px;padding:7px 16px;border-top:1px solid rgba(0,0,0,.04);font-size:12px;transition:background .1s}
.hero-exec-row:hover{background:rgba(0,0,0,.02)}
.hero-exec-row.done{background:rgba(34,197,94,0.03)}
.hero-exec-row.in-progress{background:rgba(59,130,246,0.04)}
.hero-exec-row.blocked{background:rgba(245,158,11,0.04)}
.hero-exec-icon{text-align:center;font-size:13px;flex-shrink:0}
.hero-exec-priority{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;text-align:center;flex-shrink:0}
.hero-exec-priority.p0{background:rgba(239,68,68,0.08);color:#dc2626}
.hero-exec-priority.p1{background:rgba(59,130,246,0.08);color:#2563eb}
.hero-exec-priority.p2{background:rgba(0,0,0,.04);color:var(--text3)}
.hero-exec-name{font-weight:600;color:var(--text);min-width:0}
.hero-exec-name.done-name{color:#16a34a;text-decoration:line-through;opacity:0.6}
.hero-exec-agent{font-family:'DM Mono',monospace;font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
.hero-exec-pill{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;padding:1px 7px;border-radius:100px;flex-shrink:0;text-align:center}
.hero-exec-pill.done{background:var(--green-bg);color:#16a34a}
.hero-exec-pill.ready{background:var(--blue-bg);color:var(--blue)}
.hero-exec-pill.in-progress{background:rgba(245,158,11,0.1);color:#d97706;animation:livePulse 1.5s ease-in-out infinite}
.hero-exec-pill.blocked{background:rgba(239,68,68,0.08);color:#dc2626}
.hero-exec-pill.later{background:var(--surface);color:var(--text3)}
.hero-exec.collapsed .exec-chevron{transform:rotate(-90deg)}
.hero-btn{padding:8px 20px;border-radius:980px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid transparent;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.hero-btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.hero-btn.primary:hover{background:#7c3aed}
.hero-btn.secondary{background:var(--bg);color:var(--text2);border-color:var(--sep)}
.hero-btn.secondary:hover{background:var(--surface)}
.hero-btn.ghost{background:transparent;color:var(--text3);border-color:transparent}
.hero-btn.ghost:hover{color:var(--text2);background:var(--surface)}

/* ── Tab System ── */
.tabs-bar{display:flex;gap:2px;padding:3px;background:var(--surface);border-radius:10px;margin-bottom:24px;overflow-x:auto}
.tab-btn{padding:8px 20px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;position:relative}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab-btn[data-tab="orchestrator"]{color:#7c3aed}
.tab-btn[data-tab="orchestrator"].active{background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(99,102,241,0.04));color:#7c3aed;border:1px solid rgba(139,92,246,0.15)}
.tab-btn .tab-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-left:4px}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── Lifecycle Reference Card ── */
.lifecycle-ref{background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;box-shadow:0 1px 4px rgba(0,0,0,.02)}
.lifecycle-ref-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:-0.01em;margin-bottom:4px;color:var(--text)}
.lifecycle-ref-sub{font-size:11px;color:var(--text3);margin-bottom:16px}
.lifecycle-stages{display:flex;align-items:flex-start;gap:0;position:relative}
.lifecycle-stage{flex:1;text-align:center;position:relative;padding:0 8px}
.lifecycle-stage:not(:last-child)::after{content:'';position:absolute;top:14px;right:-2px;width:calc(100% - 36px);height:2px;background:var(--surface2);left:calc(50% + 18px);z-index:0}
.lifecycle-dot-ref{width:28px;height:28px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;position:relative;z-index:1;font-size:12px;font-weight:700;color:var(--text3);border:2px solid var(--surface2)}
.lifecycle-stage-name{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.lifecycle-stage-desc{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.3}

/* ── Sprint Phase Headers ── */
.phase-header{display:flex;align-items:center;gap:14px;margin-top:28px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--sep)}
.phase-header:first-of-type{margin-top:4px}
.phase-num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.phase-num.p1{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.phase-num.p2{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.phase-num.p3{background:linear-gradient(135deg,#f97316,#ef4444)}
.phase-num.p4{background:linear-gradient(135deg,#14b8a6,#3b82f6)}
.phase-num.p5{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.phase-num.p6{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.phase-num.p7{background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.phase-num.p8{background:linear-gradient(135deg,#22c55e,#06b6d4)}
.phase-num.p9{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.phase-num.p10{background:linear-gradient(135deg,#8b5cf6,#a855f7)}
.phase-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.03em;color:var(--text)}
.phase-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);background:var(--surface);padding:2px 10px;border-radius:100px;margin-left:auto}
.phase-chevron{font-size:12px;color:var(--text3);margin-left:8px;transition:transform .2s}
.phase-header.collapsed{opacity:.85;margin-bottom:0;padding-bottom:10px}
.phase-header.collapsed + .agents-grid{margin-bottom:0}
.agents-grid.sprint-hidden{display:none !important}

/* ── Agent Card Grid ── */
.agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:32px}

/* Agent Card */
.agent-card{background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden;transition:all .2s;position:relative;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.agent-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
.agent-bar{height:4px}
.agent-inner{padding:18px 20px 16px}
.agent-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.agent-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;letter-spacing:-0.02em}
.agent-grade{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:800;padding:3px 10px;border-radius:8px;letter-spacing:-0.01em;flex-shrink:0}
.agent-grade.grade-a{background:rgba(34,197,94,0.12);color:#16a34a}
.agent-grade.grade-b{background:rgba(59,130,246,0.12);color:#2563eb}
.agent-grade.grade-c{background:rgba(245,158,11,0.12);color:#92400e}
.agent-grade.grade-d{background:rgba(239,68,68,0.1);color:#dc2626}

/* Agent structured focus */
.agent-focus-struct{font-size:12px;line-height:1.6;color:var(--text2);margin-bottom:12px}
.agent-focus-struct .focus-label{font-weight:700;color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.agent-focus-struct .focus-delivered{color:var(--text)}
.agent-focus-struct .focus-missed{color:var(--rose)}
.agent-focus-struct .focus-closed{color:var(--text3);font-style:italic;font-size:11px}

/* Lifecycle bar (5 dots) */
.lifecycle-bar{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.lc-dot{width:8px;height:8px;border-radius:50%;transition:all .15s}
.lc-dot.passed{background:#22c55e}
.lc-dot.partial{background:#22c55e;opacity:.5}
.lc-dot.failed{background:#f59e0b}
.lc-dot.skipped{background:#e4e4e7}
.lc-dot.active-stage{background:#8b5cf6;animation:livePulse 1.2s ease-in-out infinite;box-shadow:0 0 6px rgba(139,92,246,0.5)}
.lc-connector{width:12px;height:2px;background:var(--surface2)}

/* Live state indicator (auto-dispatched agents) */
.live-state{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;margin-bottom:10px;font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.02em}
.live-state.is-active{background:rgba(34,197,94,0.08);color:#16a34a;border:1px solid rgba(34,197,94,0.15)}
.live-state.is-idle{background:rgba(139,92,246,0.06);color:#7c3aed;border:1px solid rgba(139,92,246,0.12)}
.live-state.is-waiting{background:rgba(245,158,11,0.08);color:#92400e;border:1px solid rgba(245,158,11,0.15)}
.live-state.is-done{background:var(--surface);color:var(--text3);border:1px solid var(--sep)}
.live-pulse{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.live-pulse.pulse-active{background:#22c55e;animation:livePulse 1.5s ease-in-out infinite}
.live-pulse.pulse-idle{background:#8b5cf6;animation:livePulse 2.5s ease-in-out infinite}
.live-pulse.pulse-waiting{background:#f59e0b;animation:livePulse 0.8s ease-in-out infinite}
.live-pulse.pulse-done{background:#a1a1aa}
.live-state-label{text-transform:uppercase}
.live-state-detail{color:var(--text3);font-weight:400;font-size:10px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}

/* Agent card live glow */
.agent-card.is-live{border-color:rgba(34,197,94,0.25);box-shadow:0 2px 12px rgba(34,197,94,0.08)}
.agent-card.is-waiting-input{border-color:rgba(245,158,11,0.25);box-shadow:0 2px 12px rgba(245,158,11,0.08)}

/* Skills pills */
.skills-row{display:flex;flex-wrap:wrap;gap:4px}
.skill-pill{font-family:'DM Mono',monospace;font-size:9px;font-weight:600;padding:2px 8px;border-radius:100px;letter-spacing:.02em;text-transform:lowercase}
.skill-pill.used{background:rgba(139,92,246,0.1);color:#7c3aed}
.skill-pill.none{background:var(--surface);color:var(--text3);font-style:italic}

/* Agent-specific color bars */
.agent-card.ag-orchestrator .agent-bar{background:linear-gradient(90deg,#a78bfa,#7c3aed)}
.agent-card.ag-orchestrator{border-color:rgba(139,92,246,0.15)}
.agent-card.ag-orchestrator .agent-name{color:#7c3aed}
.agent-card.ag-beacon .agent-bar{background:linear-gradient(90deg,#fbbf24,#d97706)}
.agent-card.ag-beacon{border-color:rgba(245,158,11,0.15)}
.agent-card.ag-beacon .agent-name{color:#d97706}
.agent-card.ag-compass .agent-bar{background:linear-gradient(90deg,#60a5fa,#2563eb)}
.agent-card.ag-compass{border-color:rgba(59,130,246,0.15)}
.agent-card.ag-compass .agent-name{color:#2563eb}
.agent-card.ag-overwatch .agent-bar{background:linear-gradient(90deg,#22d3ee,#0891b2)}
.agent-card.ag-overwatch{border-color:rgba(6,182,212,0.15)}
.agent-card.ag-overwatch .agent-name{color:#0891b2}
.agent-card.ag-polisher .agent-bar{background:linear-gradient(90deg,#f472b6,#db2777)}
.agent-card.ag-polisher{border-color:rgba(236,72,153,0.15)}
.agent-card.ag-polisher .agent-name{color:#db2777}
.agent-card.ag-retrospector .agent-bar{background:linear-gradient(90deg,#4ade80,#16a34a)}
.agent-card.ag-retrospector{border-color:rgba(34,197,94,0.15)}
.agent-card.ag-retrospector .agent-name{color:#16a34a}
.agent-card.ag-integrator .agent-bar{background:linear-gradient(90deg,#fbbf24,#ea580c)}
.agent-card.ag-integrator{border-color:rgba(249,115,22,0.15)}
.agent-card.ag-integrator .agent-name{color:#ea580c}
.agent-card.ag-analyst .agent-bar{background:linear-gradient(90deg,#a78bfa,#6366f1)}
.agent-card.ag-analyst{border-color:rgba(99,102,241,0.15)}
.agent-card.ag-analyst .agent-name{color:#6366f1}
.agent-card.ag-video .agent-bar{background:linear-gradient(90deg,#f97316,#dc2626)}
.agent-card.ag-video{border-color:rgba(249,115,22,0.15)}
.agent-card.ag-video .agent-name{color:#dc2626}
.agent-card.ag-findings-analyst .agent-bar{background:linear-gradient(90deg,#f472b6,#9333ea)}
.agent-card.ag-findings-analyst{border-color:rgba(147,51,234,0.15)}
.agent-card.ag-findings-analyst .agent-name{color:#9333ea}
.agent-card.ag-medic .agent-bar{background:linear-gradient(90deg,#34d399,#059669)}
.agent-card.ag-medic{border-color:rgba(5,150,105,0.15)}
.agent-card.ag-medic .agent-name{color:#059669}
.agent-card.ag-workflow .agent-bar{background:linear-gradient(90deg,#f97316,#ef4444)}
.agent-card.ag-workflow{border-color:rgba(249,115,22,0.15)}
.agent-card.ag-workflow .agent-name{color:#ea580c}
.agent-card.ag-pipeline .agent-bar{background:linear-gradient(90deg,#14b8a6,#0891b2)}
.agent-card.ag-pipeline{border-color:rgba(20,184,166,0.15)}
.agent-card.ag-pipeline .agent-name{color:#0891b2}
.agent-card.ag-morning .agent-bar{background:linear-gradient(90deg,#fbbf24,#f97316)}
.agent-card.ag-morning{border-color:rgba(249,115,22,0.15)}
.agent-card.ag-morning .agent-name{color:#f97316}
.agent-card.ag-campaign-arch .agent-bar{background:linear-gradient(90deg,#8b5cf6,#ec4899)}
.agent-card.ag-campaign-arch{border-color:rgba(139,92,246,0.15)}
.agent-card.ag-campaign-arch .agent-name{color:#8b5cf6}
.agent-card.ag-skill-creator .agent-bar{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.agent-card.ag-skill-creator{border-color:rgba(99,102,241,0.15)}
.agent-card.ag-skill-creator .agent-name{color:#6366f1}
.agent-card.ag-dashboard .agent-bar{background:linear-gradient(90deg,#fbbf24,#d97706)}
.agent-card.ag-dashboard{border-color:rgba(245,158,11,0.15)}
.agent-card.ag-dashboard .agent-name{color:#d97706}
.agent-card.ag-plugin .agent-bar{background:linear-gradient(90deg,#818cf8,#4f46e5)}
.agent-card.ag-plugin{border-color:rgba(79,70,229,0.15)}
.agent-card.ag-plugin .agent-name{color:#4f46e5}
.agent-card.ag-research .agent-bar{background:linear-gradient(90deg,#2dd4bf,#0d9488)}
.agent-card.ag-research{border-color:rgba(13,148,136,0.15)}
.agent-card.ag-research .agent-name{color:#0d9488}
.agent-card.ag-default .agent-bar{background:linear-gradient(90deg,#94a3b8,#64748b)}
.agent-card.ag-default{border-color:rgba(100,116,139,0.15)}
.agent-card.ag-default .agent-name{color:#475569}
.agent-card.ag-debrief .agent-bar{background:linear-gradient(90deg,#4ade80,#16a34a)}
.agent-card.ag-debrief{border-color:rgba(34,197,94,0.15)}
.agent-card.ag-debrief .agent-name{color:#16a34a}
.agent-card.ag-grading .agent-bar{background:linear-gradient(90deg,#c084fc,#9333ea)}
.agent-card.ag-grading{border-color:rgba(147,51,234,0.15)}
.agent-card.ag-grading .agent-name{color:#9333ea}
.agent-card.ag-memory .agent-bar{background:linear-gradient(90deg,#9ca3af,#4b5563)}
.agent-card.ag-memory{border-color:rgba(107,114,128,0.15)}

.agent-card.ag-lifecycle .agent-bar{background:linear-gradient(90deg,#22d3ee,#0891b2)}

.agent-card.ag-lifecycle .agent-name{color:#0891b2}
.agent-card.ag-integration .agent-bar{background:linear-gradient(90deg,#60a5fa,#2563eb)}

.agent-card.ag-integration .agent-name{color:#2563eb}

.modal-bar.ag-beacon{background:linear-gradient(90deg,#fbbf24,#d97706) !important}
.modal-bar.ag-compass{background:linear-gradient(90deg,#60a5fa,#2563eb) !important}
.modal-bar.ag-overwatch{background:linear-gradient(90deg,#22d3ee,#0891b2) !important}
.modal-bar.ag-polisher{background:linear-gradient(90deg,#f472b6,#db2777) !important}
.modal-bar.ag-retrospector{background:linear-gradient(90deg,#4ade80,#16a34a) !important}
.modal-bar.ag-integrator{background:linear-gradient(90deg,#fbbf24,#ea580c) !important}
.modal-bar.ag-analyst{background:linear-gradient(90deg,#a78bfa,#6366f1) !important}
.modal-bar.ag-video{background:linear-gradient(90deg,#f97316,#dc2626) !important}
.modal-bar.ag-findings-analyst{background:linear-gradient(90deg,#f472b6,#9333ea) !important}
.modal-bar.ag-medic{background:linear-gradient(90deg,#34d399,#059669) !important}
.modal-bar.ag-workflow{background:linear-gradient(90deg,#f97316,#ef4444) !important}
.modal-bar.ag-pipeline{background:linear-gradient(90deg,#14b8a6,#0891b2) !important}
.modal-bar.ag-morning{background:linear-gradient(90deg,#fbbf24,#f97316) !important}
.modal-bar.ag-campaign-arch{background:linear-gradient(90deg,#8b5cf6,#ec4899) !important}
.modal-bar.ag-skill-creator{background:linear-gradient(90deg,#6366f1,#8b5cf6) !important}
.modal-bar.ag-dashboard{background:linear-gradient(90deg,#fbbf24,#d97706) !important}
.modal-bar.ag-plugin{background:linear-gradient(90deg,#818cf8,#4f46e5) !important}
.modal-bar.ag-research{background:linear-gradient(90deg,#2dd4bf,#0d9488) !important}
/* Sprint 10 distinct agent colors */
.agent-card.ag-infra-attr .agent-bar{background:linear-gradient(90deg,#06b6d4,#0e7490)}
.agent-card.ag-infra-attr{border-color:rgba(6,182,212,0.15)}
.agent-card.ag-infra-attr .agent-name{color:#0e7490}
.agent-card.ag-infra-polish .agent-bar{background:linear-gradient(90deg,#ec4899,#be185d)}
.agent-card.ag-infra-polish{border-color:rgba(236,72,153,0.15)}
.agent-card.ag-infra-polish .agent-name{color:#be185d}
.agent-card.ag-critic .agent-bar{background:linear-gradient(90deg,#f97316,#c2410c)}
.agent-card.ag-critic{border-color:rgba(249,115,22,0.15)}
.agent-card.ag-critic .agent-name{color:#c2410c}
.modal-bar.ag-infra-attr{background:linear-gradient(90deg,#06b6d4,#0e7490) !important}
.modal-bar.ag-infra-polish{background:linear-gradient(90deg,#ec4899,#be185d) !important}
.modal-bar.ag-critic{background:linear-gradient(90deg,#f97316,#c2410c) !important}
.modal-bar.ag-default{background:linear-gradient(90deg,#94a3b8,#64748b) !important}

/* ── Infrastructure Section ── */
.infra-section{background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.infra-header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--sep)}
.infra-header-icon{font-size:16px}
.infra-header-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;letter-spacing:-0.02em}
.infra-header-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);margin-left:auto;display:flex;gap:8px;align-items:center}
.infra-header-count .hc-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.infra-group{padding:0}
.infra-group-title{display:flex;align-items:center;gap:8px;padding:10px 20px;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);background:rgba(0,0,0,.02);border-bottom:1px solid rgba(0,0,0,.04);cursor:pointer;user-select:none}
.infra-group-title:hover{background:rgba(0,0,0,.04)}
.infra-group-title .infra-chevron{transition:transform .15s;font-size:10px}
.infra-group-title.collapsed .infra-chevron{transform:rotate(-90deg)}
/* Chip grid for skills */
.infra-chip-grid{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.infra-chip-subgroup{width:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.infra-chip-subgroup:not(:first-child){margin-top:4px;padding-top:8px;border-top:1px solid rgba(0,0,0,.04)}
.infra-chip-subgroup-label{width:100%;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:0 2px 2px;display:flex;align-items:center;gap:5px}
.infra-chip-subgroup-label .sg-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.infra-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;border:1px solid rgba(0,0,0,.06);background:var(--bg);font-size:12px;cursor:pointer;transition:all .15s;max-width:220px;position:relative}
.infra-chip:hover{background:rgba(139,92,246,.04);border-color:rgba(139,92,246,.15);box-shadow:0 1px 4px rgba(0,0,0,.04);transform:translateY(-1px)}
.infra-chip .chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.infra-chip .chip-dot.current{background:#16a34a}
.infra-chip .chip-dot.review{background:#d97706}
.infra-chip .chip-dot.stale{background:#dc2626}
.infra-chip .chip-name{font-family:'DM Sans',sans-serif;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infra-chip .chip-ver{font-family:'DM Mono',monospace;font-size:9px;font-weight:600;color:#7c3aed;background:rgba(139,92,246,.08);padding:1px 5px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.infra-chip[title]:hover::after{content:attr(data-staleness-label);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.infra-chip[data-staleness-label="Current"]:hover::after{background:rgba(34,197,94,.12);color:#16a34a}
.infra-chip[data-staleness-label="Review"]:hover::after{background:rgba(245,158,11,.12);color:#92400e}
.infra-chip[data-staleness-label="Stale"]:hover::after{background:rgba(239,68,68,.12);color:#dc2626}
/* Compact rows for hooks & rules */
.infra-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:5px 20px;border-bottom:1px solid rgba(0,0,0,.03);font-size:12px;cursor:pointer;transition:background .1s}
.infra-row:hover{background:rgba(139,92,246,.03)}
.infra-row:last-child{border-bottom:none}
.infra-name{font-family:'DM Sans',sans-serif;font-weight:600;color:var(--text);display:flex;align-items:baseline;gap:6px;min-width:0}
.infra-name .infra-desc{font-weight:400;color:var(--text3);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infra-version{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:rgba(139,92,246,.08);color:#7c3aed;white-space:nowrap}
.infra-stale{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px;white-space:nowrap}
.infra-stale.current{background:rgba(34,197,94,.08);color:#16a34a}
.infra-stale.review{background:rgba(245,158,11,.08);color:#92400e}
.infra-stale.stale{background:rgba(239,68,68,.08);color:#dc2626}
/* Rule source badge */
.infra-rule-source{font-family:'DM Mono',monospace;font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.04);color:var(--text3);white-space:nowrap}

/* ── Infrastructure Content Modal ── */
.infra-modal-content{font-family:'DM Mono',monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;background:var(--bg2);border:1px solid var(--sep);border-radius:10px;padding:20px;max-height:60vh;overflow-y:auto;color:var(--text)}

/* ── Report Card Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);z-index:200;justify-content:center;align-items:center;padding:24px}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border-radius:16px;width:92%;max-width:720px;max-height:85vh;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.15);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(0.97)}to{opacity:1;transform:none}}
.modal-bar{height:4px}
.modal-inner{padding:28px 32px;overflow-y:auto;max-height:calc(85vh - 4px);scroll-behavior:smooth}

/* RC Grade Header */
.rc-grade-header{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.rc-grade-letter{font-family:'Plus Jakarta Sans',sans-serif;font-size:48px;font-weight:800;width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:-0.03em}
.rc-grade-letter.grade-a{background:rgba(34,197,94,0.12);color:#16a34a}
.rc-grade-letter.grade-b{background:rgba(59,130,246,0.12);color:#2563eb}
.rc-grade-letter.grade-c{background:rgba(245,158,11,0.12);color:#92400e}
.rc-grade-letter.grade-d{background:rgba(239,68,68,0.1);color:#dc2626}
.rc-grade-letter.grade-f{background:rgba(239,68,68,0.15);color:#991b1b}
.rc-grade-letter.grade-na{background:var(--surface);color:var(--text3)}
.rc-grade-info{flex:1;min-width:0}
.rc-agent-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px}
.rc-grade-subtitle{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}
.rc-grade-reason{font-size:13px;line-height:1.5;color:var(--text2);margin-top:6px}

/* RC Lifecycle — compact inline row */
.rc-lifecycle{display:flex;gap:3px;margin-bottom:8px;padding:6px 8px;background:var(--bg2);border:1px solid var(--sep);border-radius:10px}
.rc-lc-card{flex:1;display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:7px;cursor:pointer;transition:all .12s;border:1.5px solid transparent}
.rc-lc-card:hover{background:rgba(0,0,0,.02)}
.rc-lc-card.passed{border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.03)}
.rc-lc-card.partial{border-color:rgba(245,158,11,0.2);background:rgba(245,158,11,0.03)}
.rc-lc-card.failed{border-color:rgba(239,68,68,0.2);background:rgba(239,68,68,0.03)}
.rc-lc-card.skipped{opacity:.5}
.rc-lc-card.expanded{border-color:var(--purple);background:rgba(139,92,246,.04)}
.rc-lc-emoji{font-size:13px;flex-shrink:0}
.rc-lc-text{display:flex;flex-direction:column;min-width:0}
.rc-lc-name{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;color:var(--text);line-height:1.2}
.rc-lc-status{font-family:'DM Mono',monospace;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.rc-lc-card.passed .rc-lc-status{color:#16a34a}
.rc-lc-card.partial .rc-lc-status{color:#92400e}
.rc-lc-card.failed .rc-lc-status{color:#dc2626}
.rc-lc-card.skipped .rc-lc-status{color:var(--text3)}
.rc-lc-detail{display:none}
.rc-lc-pts{display:none}
/* Lifecycle detail dropdown — sits below the card row */
.rc-lc-dropdown{height:0;overflow:hidden;margin-bottom:0}
.rc-lc-dropdown-inner{background:var(--surface);border-radius:0 0 10px 10px;padding:12px 16px;margin-top:-2px;border:1px solid var(--sep);border-top:none;font-size:12px;line-height:1.6;color:var(--text2);display:flex;align-items:flex-start;gap:10px}
.rc-lc-dropdown-emoji{font-size:16px;flex-shrink:0;margin-top:1px}
.rc-lc-dropdown-stage{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.rc-lc-dropdown-text{font-family:'DM Sans',sans-serif;font-size:12px;line-height:1.5;color:var(--text2)}

/* RC Score Breakdown */
.rc-scores{background:var(--bg2);border:1px solid var(--sep);border-radius:10px;padding:16px 18px;margin-bottom:20px}
.rc-scores-title{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:12px}
.rc-score-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rc-score-row:last-of-type{margin-bottom:0}
.rc-score-label{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--text);width:110px;flex-shrink:0}
.rc-score-bar{flex:1;height:8px;background:var(--surface2);border-radius:100px;overflow:hidden}
.rc-score-fill{height:100%;border-radius:100px;transition:width .4s ease}
.rc-score-fill.f-del{background:linear-gradient(90deg,#22c55e,#16a34a)}
.rc-score-fill.f-exec{background:linear-gradient(90deg,#3b82f6,#2563eb)}
.rc-score-fill.f-lc{background:linear-gradient(90deg,#8b5cf6,#7c3aed)}
.rc-score-fill.f-skill{background:linear-gradient(90deg,#f59e0b,#ea580c)}
.rc-score-value{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:var(--text2);width:48px;text-align:right;flex-shrink:0}
.rc-score-total{display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-top:12px;border-top:1.5px solid var(--sep)}
.rc-score-total-label{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;color:var(--text)}
.rc-score-total-value{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.02em}

/* RC Sections */
.rc-section{margin-bottom:16px}
.rc-section-label{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rc-section-count{font-family:'DM Mono',monospace;font-size:9px;background:var(--surface);padding:1px 6px;border-radius:100px}

/* RC Item List */
.rc-items{display:flex;flex-direction:column;gap:4px}
.rc-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;padding:4px 0}
.rc-item-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.rc-item.delivered .rc-item-icon{background:rgba(34,197,94,0.12);color:#16a34a}
.rc-item.missed .rc-item-icon{background:rgba(239,68,68,0.1);color:#dc2626}
.rc-item a{color:var(--purple);text-decoration:none;font-weight:600;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--purple-bg)}
.rc-item a:hover{background:rgba(139,92,246,0.12)}

/* RC Skills */
.rc-skills-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.skill-pill.missed-skill{background:var(--surface);color:var(--text3);border:1px dashed var(--surface2);font-style:italic;position:relative;padding-right:40px !important}
.skill-pill.missed-skill::after{content:'missed';font-size:7px;position:absolute;top:50%;right:4px;transform:translateY(-50%);background:var(--rose);color:#fff;padding:0 4px;border-radius:3px;font-style:normal;font-weight:700;letter-spacing:.02em}

/* RC Collapsible Sections */
.rc-collapse{border:1px solid var(--sep);border-radius:10px;overflow:hidden;margin-bottom:12px}
.rc-collapse-head{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;transition:background .12s}
.rc-collapse-head:hover{background:var(--bg2)}
.rc-collapse-icon{font-size:12px;flex-shrink:0}
.rc-collapse-title{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);flex:1}
.rc-collapse-count{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);background:var(--surface);padding:1px 6px;border-radius:100px}
.rc-collapse-chev{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.rc-collapse-body{height:0;overflow:hidden}
.rc-collapse-inner{padding:0 14px 12px;border-top:1px solid var(--sep)}

/* RC Footer */
.rc-footer{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--sep)}
.rc-btn{padding:8px 18px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;border:1px solid var(--sep);background:var(--bg);color:var(--text2)}
.rc-btn:hover{background:var(--surface)}
.rc-btn.primary{background:var(--purple);color:#fff;border:none}
.rc-btn.primary:hover{background:#7c3aed}
.rc-btn.secondary{background:var(--bg);color:var(--purple);border:1.5px solid var(--purple)}
.rc-btn.secondary:hover{background:var(--purple-bg)}

/* RC Responsive */
@media(max-width:700px){
  .rc-lifecycle{flex-wrap:wrap}
  .rc-lc-card{min-width:calc(50% - 4px)}
  .rc-grade-letter{font-size:36px;width:56px;height:56px;border-radius:12px}
  .rc-agent-name{font-size:18px}
  .rc-score-label{width:80px;font-size:11px}
}

/* ── Debrief Sections ── */
.debrief-section{background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.debrief-section-header{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;user-select:none;transition:background .12s}
.debrief-section-header:hover{background:var(--bg2)}
.debrief-section-header .col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.debrief-section-header .col-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:-0.02em}
.debrief-section-header .col-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);background:var(--surface);padding:2px 8px;border-radius:100px;margin-left:auto}
.section-chevron{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:transform .25s ease;flex-shrink:0}
.section-chevron.open{transform:rotate(180deg)}
.section-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.section-body.open{max-height:5000px}

/* Debrief items */
.debrief-list{padding:10px 14px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--sep)}
.d-item{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;font-size:12.5px;line-height:1.5;color:var(--text);transition:background .12s}
.d-item:hover{background:var(--surface)}
.d-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:6px}
.d-dot.win{background:var(--green)}
.d-dot.loss{background:var(--rose)}
.d-dot.remain{background:var(--amber)}
.d-agent{font-family:'DM Mono',monospace;font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:2px;letter-spacing:.02em;text-align:center;min-width:80px}
.d-text{color:var(--text)}
.d-text strong{font-weight:700}
.d-text .metric{font-family:'DM Mono',monospace;font-weight:700;color:var(--green);font-size:11px}
.d-text .metric.bad{color:var(--rose)}
.d-item a.view-link{color:var(--purple);text-decoration:none;font-weight:600;margin-left:4px;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--purple-bg);transition:all .12s}
.d-item a.view-link:hover{background:rgba(139,92,246,0.12)}
.loss-item .d-text{color:var(--text2)}

/* Sprint pills */
.sprint-pill{font-family:'DM Mono',monospace;font-size:9px;font-weight:600;padding:1px 7px;border-radius:100px;flex-shrink:0;margin-top:2px;letter-spacing:.02em;white-space:nowrap}

<body>

  </div>

  </nav>

<div class="shell" id="app">
  <div style="text-align:center;padding:48px;color:var(--text3);font-size:14px">Loading campaigns...</div>
</div>

<!-- Report Card Modal -->
<div class="modal-bg" id="modalBg" onclick="closeModal()"></div>

<script>
let campaigns = [];
let sessions = [];
let activeTab = 'agents';
let selectedCampaignIdx = 0;
let _lastDataHash = '';

async function load() {
  try {
    const [cRes, sRes] = await Promise.all([
      fetch('/api/campaigns'),
      fetch('/api/agents')
    ]);
    const newCampaigns = await cRes.json();
    const newSessions = await sRes.json();
    const hash = JSON.stringify(newCampaigns) + newSessions.map(s => s.sessionId + s.state + s.ts).join('');
    if (hash === _lastDataHash) return;
    _lastDataHash = hash;
    campaigns = newCampaigns;
    sessions = newSessions;
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:48px;color:var(--text3)"><strong style="display:block;font-size:18px;color:var(--text2);margin-bottom:6px">Failed to load</strong>' + e.message + '</div>';
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Agent color system: known agents get handpicked colors, new agents get auto-generated unique colors from name hash.
// No more gray defaults — every agent is visually distinct.
const AGENT_COLOR_MAP = {
  'orchestr': { bar: '#a78bfa,#7c3aed', border: 'rgba(139,92,246,0.15)', text: '#7c3aed' },
  'beacon': { bar: '#fbbf24,#d97706', border: 'rgba(251,191,36,0.15)', text: '#d97706' },
  'compass': { bar: '#60a5fa,#2563eb', border: 'rgba(59,130,246,0.15)', text: '#2563eb' },
  'overwatch': { bar: '#22d3ee,#0891b2', border: 'rgba(6,182,212,0.15)', text: '#0891b2' },
  'polisher': { bar: '#f472b6,#db2777', border: 'rgba(244,114,182,0.15)', text: '#db2777' },
  'workflow': { bar: '#f97316,#ef4444', border: 'rgba(249,115,22,0.15)', text: '#ea580c' },
  'campaign arch': { bar: '#8b5cf6,#ec4899', border: 'rgba(139,92,246,0.15)', text: '#9333ea' },
  'grading': { bar: '#a78bfa,#9333ea', border: 'rgba(147,51,234,0.15)', text: '#9333ea' },
  'dashboard': { bar: '#fbbf24,#d97706', border: 'rgba(251,191,36,0.15)', text: '#d97706' },
  'plugin': { bar: '#818cf8,#4f46e5', border: 'rgba(99,102,241,0.15)', text: '#4f46e5' },
  'video': { bar: '#f97316,#dc2626', border: 'rgba(249,115,22,0.15)', text: '#dc2626' },
};

// Generate a consistent HSL color from a string hash — ensures every unique name gets a unique hue
function nameToColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const hue = ((hash % 360) + 360) % 360;
  const sat = 65 + (hash % 20); // 65-85% saturation
  return {
    bar: 'hsl(' + hue + ',' + sat + '%,55%),hsl(' + ((hue + 30) % 360) + ',' + sat + '%,40%)',
    border: 'hsla(' + hue + ',' + sat + '%,50%,0.15)',
    text: 'hsl(' + hue + ',' + sat + '%,35%)'
  };
}

function getAgentColor(name) {
  const n = (name || '').toLowerCase();
  for (const [key, colors] of Object.entries(AGENT_COLOR_MAP)) {
    if (n.includes(key)) return colors;
  }
  return nameToColor(n); // Auto-generate for unknown agents
}

function agentCls(name) {
  // Return 'ag-auto' for all agents — colors are applied inline via getAgentColor()
  // Keep legacy classes only for orchestrators (they have special page-level styling)
  const n = (name || '').toLowerCase();
  if (n.includes('orchestr')) return 'ag-orchestrator';
  return 'ag-auto';
}

// Smart text formatting
function smartFormat(text) {
  if (text.includes(':') || text.includes('\u2014')) {
    text = text.replace(/^([^:\u2014]+)([::\u2014])/, '<strong>$1</strong>$2');
  } else {
    const words = text.split(' ');
    if (words.length > 4) {
      const cut = Math.min(6, words.findIndex((w,i) => i > 2 && (w.includes(',') || w.includes('--'))) || 6);
      text = '<strong>' + words.slice(0, cut).join(' ') + '</strong> ' + words.slice(cut).join(' ');
    }
  }
  text = text.replace(/(\d+\.?\d*)(s|x|ms|%|MB|GB|KB)\b/g, '<span class="metric">$1$2</span>');
  text = text.replace(/\b(\d+)\s+(new|prioritized|findings?|principles?|recommendations?|items?|agents?|pages?|pain points?|ranked|broadly|wins|losses|dispatch|quotes?|segments)/gi, '<span class="metric">$1</span> <strong>$2</strong>');
  text = text.replace(/(wasted|falsely|missing|couldn.t|disaster|wrong|accidentally|burned|stale|failed|broke)/gi, '<span style="color:var(--rose);font-weight:600">$1</span>');
  return text;
}

// Grade helpers
function gradeToGPA(grade) {
  const map = {'A+':4.3,'A':4.0,'A-':3.7,'B+':3.3,'B':3.0,'B-':2.7,'C+':2.3,'C':2.0,'C-':1.7,'D+':1.3,'D':1.0,'D-':0.7,'F':0};
  return grade in map ? map[grade] : 0;
}

function gradeClass(grade) {
  if (!grade) return '';
  const letter = grade.charAt(0).toUpperCase();
  if (letter === 'A') return 'grade-a';
  if (letter === 'B') return 'grade-b';
  if (letter === 'C') return 'grade-c';
  return 'grade-d';
}

function gpaColor(gpa) {
  if (gpa >= 3.5) return 'stat-green';
  if (gpa >= 3.0) return 'stat-blue';
  if (gpa >= 2.5) return 'stat-amber';
  return 'stat-rose';
}

// Lifecycle rendering
const STAGES = ['define','discover','execute','reason','verify','debrief'];
const STAGE_LABELS = ['Define','Discover','Execute','Reason','Verify','Debrief'];

function renderLifecycleDots(agent, size, liveStage) {
  const dotSize = size === 'large' ? 14 : 8;
  const connW = size === 'large' ? 20 : 12;
  let h = '';
  STAGES.forEach((stage, i) => {
    const state = agent.lifecycle ? agent.lifecycle[stage] : 'skipped';
    const isActiveStage = liveStage && liveStage.idx === i;
    let cls;
    if (isActiveStage) {
      // Active stage: blinking purple dot
      cls = 'active-stage';
    } else if (liveStage && i < liveStage.idx && state === 'skipped') {
      // Stages before the active one that aren't graded yet: show as in-progress
      cls = 'partial';
    } else {
      cls = state === 'passed' ? 'passed' : state === 'partial' ? 'partial' : state === 'failed' ? 'failed' : 'skipped';
    }
    const title = isActiveStage ? STAGE_LABELS[i] + ': ACTIVE NOW' : STAGE_LABELS[i] + ': ' + (state || 'skipped');
    h += '<span class="lc-dot ' + cls + '" style="width:' + dotSize + 'px;height:' + dotSize + 'px" title="' + title + '"></span>';
    if (i < STAGES.length - 1) h += '<span class="lc-connector" style="width:' + connW + 'px"></span>';
  });
  return h;
}

// ── Live State Lookup ──
// Cross-reference campaign agent → live dashboard session
function getAgentLiveState(agent) {
  if (!agent.sessionId || !sessions || !sessions.length) return null;
  return sessions.find(s =>
    s.sessionId === agent.sessionId ||
    (s.chainedSessions && s.chainedSessions.includes(agent.sessionId))
  );
}

// ── Lifecycle Stage Heuristic ──
// Maps the tool-based state (from hook.js) to a lifecycle stage.
// Rough but gives immediate visual feedback on campaigns page.
// Accuracy: ~70%. For 95%, agents need to self-report stages.
function inferLifecycleStage(live) {
  if (!live || !live.active) return null;
  const state = live.state;
  const detail = (live.detail || '').toLowerCase();

  // Launching state (pre-created by /api/launch)
  if (state === 'launching') return { stage: 'define', label: 'LAUNCHING', idx: 0 };

  // Reading skills directory → DISCOVER
  if (state === 'investigating' && (detail.includes('.claude/skills') || detail.includes('ls ')))
    return { stage: 'discover', label: 'DISCOVER', idx: 1 };

  // Writing/editing code → EXECUTE
  if (state === 'developing')
    return { stage: 'execute', label: 'EXECUTE', idx: 2 };

  // Running commands (tests, screenshots, curl) → VERIFY
  if (state === 'verifying')
    return { stage: 'verify', label: 'VERIFY', idx: 4 };

  // Planning → DEFINE
  if (state === 'planning')
    return { stage: 'define', label: 'DEFINE', idx: 0 };

  // Default: investigating early = DEFINE, thinking = between stages
  if (state === 'investigating')
    return { stage: 'define', label: 'DEFINE', idx: 0 };

  if (state === 'thinking')
    return { stage: 'reason', label: 'REASON', idx: 3 };

  return null;
}

function renderLiveState(live) {
  if (!live) return '';
  const isActive = live.active && !live.done;
  const isWaiting = live.state === 'waiting' || live.state === 'idle';
  const isDone = live.done;

  let stateClass, pulseClass, label, emoji;
  if (isActive && !isWaiting) {
    stateClass = 'is-active';
    pulseClass = 'pulse-active';
    emoji = live.emoji || '⚡';
    label = live.label || live.state || 'ACTIVE';
  } else if (isActive && isWaiting) {
    stateClass = 'is-waiting';
    pulseClass = 'pulse-waiting';
    emoji = live.state === 'waiting' ? '🔔' : '⏸️';
    label = live.state === 'waiting' ? 'NEEDS INPUT' : 'IDLE';
  } else if (isDone) {
    stateClass = 'is-done';
    pulseClass = 'pulse-done';
    emoji = '✓';
    label = 'DONE';
  } else {
    return '';
  }

  const detail = live.tool && live.tool !== 'stop' ? live.tool : '';
  return '<div class="live-state ' + stateClass + '">' +
    '<span class="live-pulse ' + pulseClass + '"></span>' +
    '<span>' + emoji + '</span>' +
    '<span class="live-state-label">' + label + '</span>' +
    (detail ? '<span class="live-state-detail">' + esc(detail) + '</span>' : '') +
    '</div>';
}

// ── Render Agent Card ──
function renderAgentCard(campaign, agent) {
  const cls = agentCls(agent.name);

  const grade = (agent.scoreBreakdown && agent.scoreBreakdown.total) ? scoreToGrade(agent.scoreBreakdown.total) : (agent.grade || '');

  // Structured focus
  let focusHtml = '';
  if (isLive) {

    } else {
      const closedBy = agent.status === 'completed' ? 'Completed' : agent.status;
      focusHtml += '<div class="focus-closed">Status: ' + esc(closedBy) + '</div>';

  // Skills pills
  let skillsHtml = '';
  if (agent.skillsUsed && agent.skillsUsed.length) {

    });
  } else {

  const cardExtraClass = isLive ? ' is-live' : isWaitingInput ? ' is-waiting-input' : '';

  c += '<div class="agent-bar" style="background:linear-gradient(90deg,' + agentColor.bar + ')"></div>';
  c += '<div class="agent-inner">';
  c += '<div class="agent-top">';
  c += '<span class="agent-name" style="color:' + agentColor.text + '">' + esc(agent.name) + '</span>';
  if (grade) c += '<span class="agent-grade ' + gCls + '">' + esc(grade) + '</span>';
  c += '</div>';
  c += '<div class="agent-focus-struct">' + focusHtml + '</div>';
  const liveStage = isLive ? inferLifecycleStage(live) : null;
  c += '<div class="lifecycle-bar" title="Define \u2192 Discover \u2192 Execute \u2192 Reason \u2192 Verify \u2192 Debrief">' + renderLifecycleDots(agent, 'small', liveStage) + '</div>';
  c += '<div class="skills-row">' + skillsHtml + '</div>';

  // Review agent status indicator
  if (agent.reviewStatus === 'reviewing') {
    c += '<div style="font-family:\'DM Mono\',monospace;font-size:9px;color:#7c3aed;padding:4px 8px;margin-top:2px;display:flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:#7c3aed;animation:livePulse 1.5s ease-in-out infinite"></span>Review agent analyzing...</div>';
  } else if (agent.reviewStatus === 'complete') {
    c += '<div style="font-family:\'DM Mono\',monospace;font-size:9px;color:#16a34a;padding:4px 8px;margin-top:2px">✓ Reviewed</div>';
  }

  c += '</div></div>';
  return c;
}

// Bold-lead: bold the key part before a delimiter, lighter rest
// Only split on " — " (em-dash with spaces) or ": " (colon with space), NOT on hyphens in words
function boldLead(text) {
  // Split on " — " or " – " (em/en dash with spaces)
  const dashMatch = text.match(/^(.+?)\s[—–]\s(.+)$/);
  if (dashMatch) return '<strong>' + dashMatch[1].trim() + '</strong> <span style="color:var(--text2)">— ' + dashMatch[2] + '</span>';
  // Split on ": " (colon followed by space)
  const colonIdx = text.indexOf(': ');
  if (colonIdx > 0 && colonIdx < 40) {
    return '<strong>' + text.slice(0, colonIdx) + ':</strong> <span style="color:var(--text2)">' + text.slice(colonIdx + 2) + '</span>';
  }
  // If has parenthetical, bold before paren
  const parenMatch = text.match(/^(.+?)(\s*\(.+\))$/);
  if (parenMatch) return '<strong>' + parenMatch[1] + '</strong><span style="color:var(--text2)">' + parenMatch[2] + '</span>';
  // Otherwise bold first ~4 words
  const words = text.split(' ');
  if (words.length > 4) {
    return '<strong>' + words.slice(0, 4).join(' ') + '</strong> <span style="color:var(--text2)">' + words.slice(4).join(' ') + '</span>';
  }
  return '<strong>' + text + '</strong>';
}

// ── Score Calculation ──
function calculateScore(agent) {
  const lc = agent.lifecycle || {};
  const delivered = agent.delivered || [];
  const missed = agent.missed || [];
  const skills = agent.skillsUsed || [];
  const sprint = agent.sprint || 1;

  // Use pre-computed breakdown if available
  if (agent.scoreBreakdown) return agent.scoreBreakdown;

  // Don't compute a score for agents that haven't completed
  const st = (agent.status || '').toLowerCase();
  if (st === 'ready' || st === 'active' || st === 'pending') {
    return { deliverables: 0, execution: 0, lifecycle: 0, skills: 0, total: 0 };
  }
  // Also skip if no grade, no deliverables, and all lifecycle stages are pending
  const allPending = STAGES.every(s => (lc[s] || 'pending') === 'pending');
  if (!agent.grade && delivered.length === 0 && missed.length === 0 && allPending) {
    return { deliverables: 0, execution: 0, lifecycle: 0, skills: 0, total: 0 };
  }

  // Deliverables (40 pts)
  const total = delivered.length + missed.length;
  let delScore = total > 0 ? Math.round(40 * delivered.length / total) : 20;
  const hasUserClose = missed.some(m => /closed.*user|user.*closed/i.test(m));
  if (hasUserClose) delScore = Math.min(delScore, 15);

  // Execution Quality (25 pts)
  let execScore = 25;
  if (hasUserClose) execScore -= 10;
  if (missed.some(m => /waste|burned|token/i.test(m))) execScore -= 5;
  if (missed.some(m => /failed|iteration|broke/i.test(m))) execScore -= 5;
  if (missed.length > delivered.length && delivered.length > 0) execScore -= 3;
  execScore = Math.max(3, execScore);

  // Lifecycle (20 pts, 4 per stage)
  const stagePts = { passed: 4, partial: 2, failed: 1, skipped: 0, 'in-progress': 2, pending: 0 };
  let lcScore = 0;
  STAGES.forEach(stage => {
    const state = lc[stage] || 'skipped';
    let pts = stagePts[state] !== undefined ? stagePts[state] : 0;
    if (state === 'skipped' && sprint <= 3) pts = 2;
    lcScore += pts;
  });

  // Skills (15 pts) — aligned with Discover lifecycle stage
  const note = agent.skillsNote || '';
  const discoverState = lc.discover || 'skipped';
  let skillScore;
  if (skills.length >= 2) skillScore = 15;
  else if (skills.length === 1) skillScore = 13;
  else if (/not expected|not needed|core job/i.test(note)) skillScore = 12;
  else if (discoverState === 'failed') skillScore = 0;
  else if (/would have benefited/i.test(note)) skillScore = 5;
  else if (discoverState === 'skipped' || discoverState === 'pending') skillScore = 3;
  else skillScore = 5;

  return {
    deliverables: delScore,
    execution: execScore,
    lifecycle: lcScore,
    skills: skillScore,
    total: delScore + execScore + lcScore + skillScore
  };
}

function scoreToGrade(score) {
  if (score >= 97) return 'A+';
  if (score >= 93) return 'A';
  if (score >= 90) return 'A-';
  if (score >= 87) return 'B+';
  if (score >= 83) return 'B';
  if (score >= 80) return 'B-';
  if (score >= 77) return 'C+';
  if (score >= 73) return 'C';
  if (score >= 70) return 'C-';
  if (score >= 67) return 'D+';
  if (score >= 63) return 'D';
  if (score >= 60) return 'D-';
  return 'F';
}

function getLifecycleDetail(agent, stage) {
  const lc = agent.lifecycle || {};
  const state = lc[stage] || 'skipped';
  const skills = agent.skillsUsed || [];
  const delivered = agent.delivered || [];
  const missed = agent.missed || [];
  const note = agent.skillsNote || '';

  switch(stage) {
    case 'define':
      if (state === 'passed') return 'Read all specified context files and understood the mission before starting.';
      if (state === 'partial') return 'Read some context but started execution before fully understanding requirements.';
      if (state === 'failed') return 'Did not read required context. Started guessing.';
      return 'Define stage was not tracked for this agent.';
    case 'discover':
      if (state === 'passed') return skills.length > 0
        ? 'Checked available skills and used: ' + skills.join(', ') + '.'
        : 'Checked available skills. Determined none were needed for this task type.';
      if (state === 'partial') return note || ('Partially checked for skills. ' + (skills.length ? 'Used ' + skills.join(', ') + ' but missed others.' : 'Did not use relevant skills found.'));
      if (state === 'failed') return note || ('Failed to discover available skills. ' + (skills.length ? 'Eventually used ' + skills.join(', ') + ' after failures.' : 'No skill usage despite relevance.'));
      return note || 'Did not check for available skills or tools.';
    case 'execute':
      if (state === 'passed') return 'Delivered ' + delivered.length + ' item' + (delivered.length !== 1 ? 's' : '') + '. Clean implementation matching requirements.';
      if (state === 'partial') return 'Partially executed. ' + delivered.length + ' delivered, ' + missed.length + ' missed.';
      if (state === 'failed') return 'Execution failed. ' + (missed.length ? 'Key issues: ' + missed.slice(0,2).join('; ') + '.' : 'Multiple failed attempts.');
      if (state === 'in-progress') return 'Execution is still in progress.';
      return 'Never reached execution phase.';
    case 'reason':
      if (state === 'passed') return 'Reflected on output quality and evaluated against requirements.';
      if (state === 'partial') return 'Some reflection but gaps in self-evaluation. Did not catch all issues before completion.';
      if (state === 'failed') return 'Reflected but drew wrong conclusions or shipped despite known issues.';
      return 'No reflection or reasoning phase observed.';
    case 'verify':
      if (state === 'passed') return 'Playwright screenshot taken and critically evaluated. Output confirmed working.';
      if (state === 'partial') return 'Some verification but missed issues that required follow-up.';
      if (state === 'failed') return 'Attempted verification but missed obvious issues.';
      return 'No verification performed. User was first to see output.';
    case 'debrief':
      if (state === 'passed') return 'Self-reported delivered/missed/lessons before exit. Report card data is agent-authored.';
      if (state === 'partial') return 'Partial self-report — some delivered/missed items but no lessons captured.';
      if (state === 'failed') return 'Did not self-report. Delivered/missed data was manually added by orchestrator.';
      return 'No debrief performed. Agent exited without self-reporting deliverables or lessons.';
  }
  return '';
}

function getSuggestedSkills(agent) {
  const focus = (agent.focus || '').toLowerCase();
  const used = (agent.skillsUsed || []).map(s => s.toLowerCase());
  const suggestions = [];
  if (/page|redesign|polish|ui|dashboard|modal|report|overhaul|visual/i.test(focus)) {
    if (!used.includes('frontend-design')) suggestions.push('frontend-design');
    if (!used.includes('impeccable-polish')) suggestions.push('impeccable-polish');
  }
  if (/overhaul|redesign|design|brainstorm/i.test(focus)) {
    if (!used.includes('brainstorming')) suggestions.push('brainstorming');
  }
  if (/fix|bug|broken/i.test(focus)) {
    if (!used.includes('systematic-debugging')) suggestions.push('systematic-debugging');
  }
  return suggestions;
}

// ── Report Card Modal ──
function openReportCard(slot, campaignId) {
  const camp = campaigns.find(c => c.id === campaignId);
  if (!camp) return;
  const agent = camp.agents.find(a => a.slot === slot);
  if (!agent) return;
  const cls = agentCls(agent.name);
  const score = calculateScore(agent);
  // FIX: Always use computed grade from score — prevents letter/score mismatch
  const grade = score.total > 0 ? scoreToGrade(score.total) : (agent.grade || 'N/A');
  const computedGrade = scoreToGrade(score.total);
  const stageEmojis = ['\uD83C\uDFAF','\uD83D\uDD0D','\u26A1','\uD83E\uDDE0','\u2705','\uD83D\uDCDD'];
  const stageStatusLabels = { passed:'Passed', partial:'Partial', failed:'Failed', skipped:'Skipped', 'in-progress':'Active', pending:'Pending' };
  const stagePtsMap = { passed:4, partial:2, failed:1, skipped:0, 'in-progress':2, pending:0 };

  const modalColor = getAgentColor(agent.name);
  let h = '<div class="modal" onclick="event.stopPropagation()">';
  h += '<div class="modal-bar" style="background:linear-gradient(90deg,' + modalColor.bar + ') !important"></div>';
  h += '<div class="modal-inner">';

  // Grade Header — large letter + info
  const letterOnly = grade !== 'N/A' ? grade : '?';
  const gColorCls = grade !== 'N/A' ? (grade.charAt(0).toLowerCase() === 'a' ? 'a' : grade.charAt(0).toLowerCase() === 'b' ? 'b' : grade.charAt(0).toLowerCase() === 'c' ? 'c' : grade.charAt(0).toLowerCase() === 'd' ? 'd' : 'f') : 'na';
  h += '<div class="rc-grade-header">';
  h += '<div class="rc-grade-letter grade-' + gColorCls + '">' + esc(letterOnly) + '</div>';
  h += '<div class="rc-grade-info">';
  h += '<div class="rc-agent-name ' + cls + ' agent-name">' + esc(agent.name) + '</div>';
  h += '<div class="rc-grade-subtitle">Sprint ' + (agent.sprint || '?') + ' &middot; ' + esc(grade) + (grade !== 'N/A' ? ' &middot; Score: ' + score.total + '/100' : '') + '</div>';
  if (agent.gradeReason) h += '<div class="rc-grade-reason">' + esc(agent.gradeReason) + '</div>';
  h += '</div></div>';

  // Requirements — what this agent was set out to do (from PRD)
  if (agent.brief || agent.focus) {
    h += '<div class="rc-collapse" style="margin-bottom:12px">';
    h += '<div class="rc-collapse-head" onclick="toggleRcCollapse(this)">';
    h += '<span class="rc-collapse-icon">📋</span>';
    h += '<span class="rc-collapse-title">Requirements</span>';
    h += '<span class="rc-collapse-chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>';
    h += '</div>';
    h += '<div class="rc-collapse-body"><div class="rc-collapse-inner" style="padding-top:8px">';
    h += '<div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px">' + esc(agent.focus) + '</div>';
    if (agent.brief) {
      h += '<div id="rc-requirements-' + esc(slot) + '" style="font-size:12px;line-height:1.6;color:var(--text2)">Loading requirements...</div>';
    }
    h += '</div></div></div>';
  }

  // Lifecycle Breakdown — 5 clickable cards + shared dropdown
  h += '<div class="rc-lifecycle">';
  STAGES.forEach((stage, i) => {
    const state = agent.lifecycle ? agent.lifecycle[stage] : 'skipped';
    const statusCls = state === 'passed' ? 'passed' : state === 'partial' ? 'partial' : state === 'failed' ? 'failed' : 'skipped';
    const statusLabel = stageStatusLabels[state] || 'Skipped';
    const detail = getLifecycleDetail(agent, stage);
    const sprint = agent.sprint || 1;
    let pts = stagePtsMap[state] !== undefined ? stagePtsMap[state] : 0;
    if (state === 'skipped' && sprint <= 3) pts = 2;

    h += '<div class="rc-lc-card ' + statusCls + '" data-detail="' + esc(detail) + '" data-emoji="' + stageEmojis[i] + '" data-stage="' + STAGE_LABELS[i] + '" onclick="toggleLcDetail(this)">';
    h += '<div class="rc-lc-emoji">' + stageEmojis[i] + '</div>';
    h += '<div class="rc-lc-text"><div class="rc-lc-name">' + STAGE_LABELS[i] + '</div>';
    h += '<div class="rc-lc-status">' + statusLabel + '</div></div>';
    h += '</div>';
  });
  h += '</div>';
  // Shared dropdown panel for lifecycle detail
  h += '<div class="rc-lc-dropdown" id="rc-lc-dropdown"><div class="rc-lc-dropdown-inner"><span class="rc-lc-dropdown-emoji"></span><div><div class="rc-lc-dropdown-stage"></div><div class="rc-lc-dropdown-text"></div></div></div></div>';

  // Score — total shown inline, breakdown is collapsible
  // Only show score if agent has a grade or has progressed past pending
  const _lc = agent.lifecycle || {};
  const allPending = STAGES.every(s => (_lc[s] || 'pending') === 'pending');
  const hasGradeData = agent.grade || agent.scoreBreakdown || !allPending;
  const totalColor = score.total >= 85 ? '#16a34a' : score.total >= 73 ? '#2563eb' : score.total >= 60 ? '#92400e' : '#dc2626';
  const factors = [
    { label: 'Deliverables', value: score.deliverables, max: 40, fillCls: 'f-del' },
    { label: 'Execution', value: score.execution, max: 25, fillCls: 'f-exec' },
    { label: 'Lifecycle', value: score.lifecycle, max: 20, fillCls: 'f-lc' },
    { label: 'Skills', value: score.skills, max: 15, fillCls: 'f-skill' }
  ];
  if (hasGradeData) {
    h += '<div class="rc-collapse" style="margin-bottom:16px">';
    h += '<div class="rc-collapse-head" onclick="toggleRcCollapse(this)">';
    h += '<span class="rc-collapse-icon">📊</span>';
    h += '<span class="rc-collapse-title">Score Breakdown</span>';
    h += '<span style="font-family:\'Plus Jakarta Sans\',sans-serif;font-size:15px;font-weight:800;color:' + totalColor + ';margin-left:auto;margin-right:8px">' + score.total + '/100 (' + computedGrade + ')</span>';
    h += '<span class="rc-collapse-chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>';
    h += '</div>';
    h += '<div class="rc-collapse-body"><div class="rc-collapse-inner" style="padding-top:12px">';
    factors.forEach(f => {
      const pct = Math.round((f.value / f.max) * 100);
      h += '<div class="rc-score-row">';
      h += '<span class="rc-score-label">' + f.label + '</span>';
      h += '<div class="rc-score-bar"><div class="rc-score-fill ' + f.fillCls + '" style="width:' + pct + '%"></div></div>';
      h += '<span class="rc-score-value">' + f.value + '/' + f.max + '</span>';
      h += '</div>';
    });
    h += '</div></div></div>';
  } else {
    h += '<div style="background:var(--bg2);border:1px solid var(--sep);border-radius:10px;padding:16px 18px;margin-bottom:16px;text-align:center">';
    h += '<span style="font-family:\'DM Sans\',sans-serif;font-size:12px;color:var(--text3)">Score available after agent completes</span>';
    h += '</div>';
  }

  // ── Summary (open by default) — big picture: top delivered + all missed ──
  const delivered = agent.delivered || [];
  const missed = agent.missed || [];
  const summaryItems = [];
  delivered.slice(0, 3).forEach(d => summaryItems.push({ type: 'delivered', text: d }));
  missed.slice(0, 2).forEach(m => summaryItems.push({ type: 'missed', text: m }));

  if (summaryItems.length) {
    h += '<div class="rc-collapse">';
    h += '<div class="rc-collapse-head" onclick="toggleRcCollapse(this)">';
    h += '<span class="rc-collapse-icon">📋</span>';
    h += '<span class="rc-collapse-title">Summary</span>';
    h += '<span class="rc-collapse-count">' + delivered.length + ' delivered, ' + missed.length + ' missed</span>';
    h += '<span class="rc-collapse-chev" style="transform:rotate(180deg)"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>';
    h += '</div>';
    h += '<div class="rc-collapse-body" data-open="1" style="height:auto"><div class="rc-collapse-inner">';
    h += '<div class="rc-items" style="padding-top:8px">';
    summaryItems.forEach(item => {
      const icon = item.type === 'delivered' ? '\u2713' : '\u2717';
      const cls = item.type;
      const pageMatch = item.text.match(/^\/([\w-]+)/);
      let link = '';
      if (pageMatch && item.type === 'delivered') link = ' <a href="/' + esc(pageMatch[1]) + '">View</a>';
      h += '<div class="rc-item ' + cls + '"><span class="rc-item-icon">' + icon + '</span><div>' + boldLead(esc(item.text)) + link + '</div></div>';
    });
    if (delivered.length > 3) h += '<div style="font-size:11px;color:var(--text3);padding:4px 0 0 26px">+' + (delivered.length - 3) + ' more delivered</div>';
    if (missed.length > 2) h += '<div style="font-size:11px;color:var(--text3);padding:2px 0 0 26px">+' + (missed.length - 2) + ' more missed</div>';
    h += '</div></div></div></div>';
  }

  // ── Delivered (collapsed by default) ──
  if (delivered.length) {
    h += '<div class="rc-collapse">';
    h += '<div class="rc-collapse-head" onclick="toggleRcCollapse(this)">';
    h += '<span class="rc-collapse-icon" style="color:var(--green)">\u2713</span>';
    h += '<span class="rc-collapse-title" style="color:#16a34a">Delivered</span>';
    h += '<span class="rc-collapse-count">' + delivered.length + '</span>';
    h += '<span class="rc-collapse-chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>';
    h += '</div>';
    h += '<div class="rc-collapse-body"><div class="rc-collapse-inner">';
    h += '<div class="rc-items" style="padding-top:8px">';
    delivered.forEach(d => {
      const pageMatch = d.match(/^\/([\w-]+)/);
      let link = '';
      if (pageMatch) link = ' <a href="/' + esc(pageMatch[1]) + '">View</a>';
      h += '<div class="rc-item delivered"><span class="rc-item-icon">\u2713</span><div>' + boldLead(esc(d)) + link + '</div></div>';
    });
    h += '</div></div></div></div>';
  }

  // ── Missed (collapsed by default) ──
  if (missed.length) {
    h += '<div class="rc-collapse">';
    h += '<div class="rc-collapse-head" onclick="toggleRcCollapse(this)">';
    h += '<span class="rc-collapse-icon" style="color:var(--rose)">\u2717</span>';
    h += '<span class="rc-collapse-title" style="color:#dc2626">Missed</span>';
    h += '<span class="rc-collapse-count">' + missed.length + '</span>';
    h += '<span class="rc-collapse-chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>';
    h += '</div>';
    h += '<div class="rc-collapse-body"><div class="rc-collapse-inner">';
    h += '<div class="rc-items" style="padding-top:8px">';
    missed.forEach(m => {
      h += '<div class="rc-item missed"><span class="rc-item-icon">\u2717</span><div>' + boldLead(esc(m)) + '</div></div>';
    });
    h += '</div></div></div></div>';
  }

  // Skills — used + missed (suggested)
  h += '<div class="rc-section">';
  h += '<div class="rc-section-label">Skills</div>';
  h += '<div class="rc-skills-row">';
  if (agent.skillsUsed && agent.skillsUsed.length) {
    agent.skillsUsed.forEach(sk => {
      h += '<span class="skill-pill used" style="font-size:11px;padding:3px 10px">' + esc(sk) + '</span>';
    });
  }
  const suggested = hasGradeData ? getSuggestedSkills(agent) : [];
  suggested.forEach(sk => {
    h += '<span class="skill-pill missed-skill" style="font-size:11px;padding:3px 10px">' + esc(sk) + '</span>';
  });
  if (!(agent.skillsUsed && agent.skillsUsed.length) && !suggested.length) {
    h += '<span class="skill-pill none" style="font-size:11px;padding:3px 10px">none</span>';
  }
  h += '</div>';
  if (agent.skillsNote) {
    h += '<div style="font-size:12px;line-height:1.5;color:var(--text2);font-style:italic;margin-top:4px">' + esc(agent.skillsNote) + '</div>';
  }
  h += '</div>';

  // Footer
  h += '<div class="rc-footer">';
  h += '<button class="rc-btn" onclick="closeModal()">Close</button>';
  if (agent.followUpBrief) {
    h += '<button class="rc-btn secondary" onclick="copyFollowUp(\'' + esc(agent.slot) + '\')">Copy Follow-up</button>';
  }
  if (agent.brief) {
    h += '<button class="rc-btn primary" onclick="copyBrief(\'' + esc(agent.slot) + '\')">Copy Initial Prompt</button>';
  }
  h += '</div>';

  h += '</div></div>';

  const bg = document.getElementById('modalBg');
  bg.innerHTML = h;
  bg.classList.add('open');

  // Load PRD requirements asynchronously
  if (agent.brief) {
    const reqEl = document.getElementById('rc-requirements-' + slot);
    if (reqEl) {
      var briefFile = agent.brief.replace(/^coordinated-sprint\//, '');
      fetch('/api/brief/' + encodeURIComponent(briefFile))
        .then(function(r) { return r.ok ? r.text() : null; })
        .then(function(text) {
          if (!text || !reqEl) return;
          // Extract mission line and key steps from PRD
          var lines = text.split('\n');
          var mission = '';
          var steps = [];
          var inExecute = false;
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.startsWith('## Mission:')) mission = line.replace('## Mission:', '').trim();
            if (line.startsWith('**Step ') && line.includes(':')) {
              var stepText = line.replace(/\*\*/g, '').replace(/^Step \d+:\s*/, '');
              steps.push(stepText);
            }
          }
          var html = '';
          if (mission) html += '<div style="font-size:13px;font-weight:700;color:var(--purple);margin-bottom:8px">"' + mission + '"</div>';
          if (steps.length) {
            html += '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Key requirements from PRD:</div>';
            steps.forEach(function(s) {
              html += '<div style="font-size:12px;color:var(--text2);padding:2px 0;padding-left:12px;border-left:2px solid var(--sep)">' + s + '</div>';
            });
          }
          if (!html) html = '<div style="font-size:12px;color:var(--text3)">PRD loaded — see Copy Initial Prompt for full details</div>';
          reqEl.innerHTML = html;
        })
        .catch(function() { if (reqEl) reqEl.innerHTML = '<span style="color:var(--text3);font-size:11px">Could not load PRD</span>'; });
    }
  }
}

function toggleRcCollapse(head) {
  const body = head.nextElementSibling;
  const chev = head.querySelector('.rc-collapse-chev');
  if (!body) return;
  const isOpen = body.dataset.open === '1';
  if (isOpen) {
    gsap.to(body, { height: 0, duration: 0.3, ease: 'power2.inOut' });
    if (chev) gsap.to(chev, { rotation: 0, duration: 0.25, ease: 'power2.inOut' });
    body.dataset.open = '0';
  } else {
    gsap.to(body, { height: 'auto', duration: 0.35, ease: 'power2.out' });
    if (chev) gsap.to(chev, { rotation: 180, duration: 0.25, ease: 'power2.inOut' });
    body.dataset.open = '1';
  }
}

// ── Infrastructure Attribution ──
window._infraItems = [];

function getInfraStaleness(createdBy, currentVersion) {
  var ver = parseFloat((createdBy.match(/(\d+\.?\d*)/) || [0,0])[1]);
  var gap = Math.round((currentVersion - ver) * 10);
  if (gap <= 2) return 'current';
  if (gap <= 4) return 'review';
  return 'stale';
}

async function openInfraModal(idx) {
  var item = window._infraItems[idx];
  if (!item) return;
  var type = item.type;
  var name = item.name;
  var content = '';

  if (type === 'skill') {
    try {
      var r = await fetch('/api/skill/' + encodeURIComponent(name));
      var d = await r.json();
      content = d.content || d.error || 'Skill not found.';
    } catch(e) {
      content = 'Failed to load skill: ' + e.message;
    }
  } else if (type === 'hook') {
    // Try hook name via /api/hook/<name> which resolves paths server-side (no hardcoded user paths)
    var found = false;
    try {
      var hr = await fetch('/api/hook/' + encodeURIComponent(name));
      var hd = await hr.json();
      if (hd.content) { content = hd.content; found = true; }
    } catch(e) {}
    if (!found) content = 'Hook file not found. The server checks .claude/scripts/, .claude/hooks/, and .claude/agent-hub/ automatically.';
    if (item.description) content = '// ' + item.description + '\n\n' + content;
  } else {
    content = 'Rules are defined in CLAUDE.md and the orchestrator-rules skill.\n\n' + name;
  }

  // Build modal — uses same pattern as openReportCard (esc() escapes all user content)
  var bg = document.getElementById('modalBg');
  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.onclick = function(e) { e.stopPropagation(); };

  var bar = document.createElement('div');
  bar.className = 'modal-bar';
  bar.style.background = 'linear-gradient(90deg,#8b5cf6,#6366f1)';
  modal.appendChild(bar);

  var inner = document.createElement('div');
  inner.className = 'modal-inner';

  var header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap';
  var titleEl = document.createElement('div');
  titleEl.style.cssText = "font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.02em";
  titleEl.textContent = name;
  header.appendChild(titleEl);
  var versionPill = document.createElement('span');
  versionPill.className = 'infra-version';
  versionPill.textContent = item.createdBy;
  header.appendChild(versionPill);
  var staleBadge = document.createElement('span');
  staleBadge.className = 'infra-stale ' + item.staleness;
  staleBadge.textContent = item.staleness === 'current' ? 'Current' : item.staleness === 'review' ? 'Review' : 'Stale';
  header.appendChild(staleBadge);
  inner.appendChild(header);

  if (item.description) {
    var descEl = document.createElement('div');
    descEl.style.cssText = 'font-size:13px;color:var(--text2);margin-bottom:16px';
    descEl.textContent = item.description;
    inner.appendChild(descEl);
  }

  var contentEl = document.createElement('div');
  contentEl.className = 'infra-modal-content';
  contentEl.textContent = content;
  inner.appendChild(contentEl);

  var footer = document.createElement('div');
  footer.style.cssText = 'padding-top:20px;text-align:right';
  var closeBtn = document.createElement('button');
  closeBtn.className = 'rc-btn';
  closeBtn.textContent = 'Close';
  closeBtn.onclick = closeModal;
  footer.appendChild(closeBtn);
  inner.appendChild(footer);

  modal.appendChild(inner);
  bg.textContent = '';
  bg.appendChild(modal);
  bg.classList.add('open');
}

async function copyBriefFile(filename, btnSelector, successLabel) {
  try {
    const res = await fetch('/api/brief/' + encodeURIComponent(filename));
    if (!res.ok) throw new Error('File not found');
    const text = await res.text();
    await navigator.clipboard.writeText(text);
    const btn = document.querySelector(btnSelector);
    if (btn) { const orig = btn.textContent; btn.textContent = 'Copied!'; btn.style.background = 'var(--green)'; btn.style.color = '#fff'; setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; }, 2000); }
    return true;
  } catch(e) {
    showToast('Failed to copy: ' + e.message);
    return false;
  }
}
