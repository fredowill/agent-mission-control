// ── Main Render ──
function render() {
  const app = document.getElementById('app');
  if (!campaigns.length) {
    app.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text3)"><strong style="display:block;font-size:18px;color:var(--text2);margin-bottom:6px">No campaigns yet</strong>Create a campaign to coordinate multi-agent efforts</div>';
    return;
  }

  // Clamp index
  if (selectedCampaignIdx >= campaigns.length) selectedCampaignIdx = 0;
  const c = campaigns[selectedCampaignIdx];
  const agents = c.agents || [];
  const db = c.debrief || {};
  const manualWins = (db.wins || []).map(w => Object.assign({}, w, { auto: false }));
  const manualLosses = (db.losses || []).map(l => Object.assign({}, l, { auto: false }));
  const remaining = db.remaining || [];
  const deferred = db.deferred || [];

  // ── Auto-populate wins/losses from agent grading data ──
  const autoWins = [];
  const autoLosses = [];
  agents.forEach(a => {
    if (a.delivered && a.delivered.length) {
      a.delivered.forEach(item => {
        autoWins.push({ agent: a.name, text: item, sprint: a.sprint, auto: true });
      });
    }
    if (a.missed && a.missed.length) {
      a.missed.forEach(item => {
        autoLosses.push({ agent: a.name, text: item, sprint: a.sprint, auto: true });
      });
    }
  });

  // Merge: manual first, then auto. Deduplicate (manual wins over auto).
  function dedup(manual, auto) {
    const manualTexts = manual.map(m => (m.text || '').toLowerCase());
    const filtered = auto.filter(a => {
      const at = (a.text || '').toLowerCase();
      return !manualTexts.some(mt => mt.includes(at) || at.includes(mt));
    });
    const all = manual.concat(filtered);
    all.sort((a, b) => {
      const sa = a.sprint || 0, sb = b.sprint || 0;
      if (sb !== sa) return sb - sa;
      if (a.auto !== b.auto) return a.auto ? 1 : -1;
      return 0;
    });
    return all;
  }
  const wins = dedup(manualWins, autoWins);
  const losses = dedup(manualLosses, autoLosses);

  // Calculate stats
  const gradedAgents = agents.filter(a => a.grade);
  const gpaSum = gradedAgents.reduce((s, a) => s + gradeToGPA(a.grade), 0);
  const gpa = gradedAgents.length ? (gpaSum / gradedAgents.length).toFixed(2) : 'N/A';
  const dateStr = c.created ? new Date(c.created + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '';
  const sprintCount = [...new Set(agents.map(a => a.sprint).filter(Boolean))].length;

  let h = '';

  // ── Campaign Selector (multi-campaign navigation) ──
  h += renderCampaignSelector();

  // ── HERO ──
  h += '<div class="hero">';
  h += '<div class="hero-gradient"></div>';
  h += '<div class="hero-inner">';
  h += '<div class="hero-top">';
  const statusClass = c.status === 'retrospective' ? 'retro' : c.status === 'closed' ? 'done' : esc(c.status);
  h += '<span class="hero-status ' + statusClass + '">' + esc(c.status) + '</span>';
  if (dateStr) h += '<span class="hero-date">Started ' + esc(dateStr) + '</span>';
  h += '</div>';
  h += '<div class="hero-name">' + esc(c.name) + '</div>';
  h += '<div class="hero-desc">' + esc(c.description) + '</div>';

  // Stats row
  h += '<div class="hero-stats">';
  h += '<div class="hero-stat gpa"><span class="hero-stat-value ' + gpaColor(parseFloat(gpa)) + '">' + gpa + '</span><span class="hero-stat-label">Campaign GPA</span></div>';
  h += '<div class="hero-stat"><span class="hero-stat-value stat-purple">' + agents.length + '</span><span class="hero-stat-label">Agents</span></div>';
  h += '<div class="hero-stat"><span class="hero-stat-value stat-green">' + wins.length + '</span><span class="hero-stat-label">Wins</span></div>';
  h += '<div class="hero-stat"><span class="hero-stat-value stat-rose">' + losses.length + '</span><span class="hero-stat-label">Losses</span></div>';
  h += '<div class="hero-stat"><span class="hero-stat-value stat-amber">' + remaining.length + '</span><span class="hero-stat-label">Remaining</span></div>';
  h += '<div class="hero-stat"><span class="hero-stat-value stat-blue">' + sprintCount + '</span><span class="hero-stat-label">Sprints</span></div>';
  h += '</div>';

  // Data-driven execution plan from campaigns.json
  const plan = c.executionPlan;
  if (plan && plan.items) {
    h += '<div class="hero-exec">';
    h += '<div class="hero-exec-title" style="cursor:pointer" onclick="var body=this.nextElementSibling;if(!body)return;var wrap=this.parentElement;if(wrap.classList.contains(\'collapsed\')){wrap.classList.remove(\'collapsed\');wrap.style.maxHeight=\'\'}else{wrap.classList.add(\'collapsed\');wrap.style.maxHeight=this.offsetHeight+2+\'px\';wrap.style.overflow=\'hidden\'}"><span style="transition:transform .15s;display:inline-block;margin-right:4px" class="exec-chevron">▼</span> 🎯 Execution Plan <span class="hero-exec-version">' + esc(plan.version) + '</span><span style="margin-left:auto;font-family:\'DM Mono\',monospace;font-size:10px;color:var(--text3)">' + plan.items.filter(function(i){return i.status==="done"}).length + '/' + plan.items.length + ' done</span></div><div>';

    // Group by sprint
    const sprintGroups = {};
    plan.items.forEach(item => {
      const s = item.sprint || 0;
      if (!sprintGroups[s]) sprintGroups[s] = [];
      sprintGroups[s].push(item);
    });
    const sprintLabels = { 0: 'Carry → Campaign-002', 6: 'Sprint 6 — Overhaul', 7: 'Sprint 7 — Systems', 8: 'Sprint 8 — Auto-Dispatch', 9: 'Sprint 9 — Integration', 10: 'Sprint 10 — Polish', 11: 'Sprint 11 — Close-Out' };

    // Sort sprints but put 0 (carry items) last
    Object.keys(sprintGroups).sort((a,b) => { if (a == 0) return 1; if (b == 0) return -1; return a - b; }).forEach(sprint => {
      const sLabel = sprintLabels[sprint] ? sprintLabels[sprint].split(' — ')[1] : '';
      const headerText = sprint == 0 ? '📦 Carry → Next Campaign' : 'Sprint ' + sprint;
      h += '<div class="hero-exec-sprint-header">' + headerText + (sLabel && sprint != 0 ? ' <span style="color:var(--text3);font-weight:600">' + sLabel + '</span>' : '') + '</div>';
      sprintGroups[sprint].forEach(item => {
        const statusIcons = { done: '✅', ready: '⬜', 'in-progress': '⚡', blocked: '🔶', deferred: '⏸️' };

// Agent name style helper
function getAgentNameStyle(name) {
  const colors = {
    'orchestr': '#7c3aed', 'beacon': '#d97706', 'compass': '#2563eb', 'overwatch': '#0891b2',
    'polisher': '#db2777', 'retrospect': '#16a34a', 'integrat': '#ea580c', 'analyst': '#6366f1',
    'video': '#dc2626', 'workflow': '#ea580c', 'pipeline': '#0891b2', 'morning': '#f97316',
    'medic': '#059669', 'findings': '#9333ea', 'dashboard': '#d97706'
  };
  const n = (name || '').toLowerCase();
  for (const [key, color] of Object.entries(colors)) {
    if (n.includes(key)) return 'color:' + color;
  }
  return '';
}

// ── Collapse state management ──
function getCollapseState(key, defaultOpen) {
  const stored = localStorage.getItem('mc-db-section-' + key);
  if (stored === null) return !!defaultOpen;
  return stored === '1';
}

function toggleCollapse(key) {
  const body = document.getElementById('body-' + key);
  const chevron = document.getElementById('chev-' + key);
  if (!body) return;
  const isOpen = body.classList.toggle('open');
  if (chevron) chevron.classList.toggle('open', isOpen);
  localStorage.setItem('mc-db-section-' + key, isOpen ? '1' : '0');
}

// ── Campaign status ──
async function setCampaignStatus(campaignId, status) {
  try {
    await fetch('/api/campaigns/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ campaignId, status })
    });
    _lastDataHash = ''; // Force re-render
    await load();
    showToast('Campaign ' + status);
  } catch(e) { showToast('Failed: ' + e.message); }
}

// ── Retrospective ──
let retroCache = {};
async function loadRetro(campaignId) {
  if (retroCache[campaignId]) return retroCache[campaignId];
  try {
    const res = await fetch('/api/retrospective/' + campaignId);
    const data = await res.json();
    retroCache[campaignId] = data.content;
    return data.content;
  } catch { return null; }
}

function parseMarkdownBasic(md) {
  let html = md
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/```[\s\S]*?```/g, function(m) {
      return '<pre>' + m.replace(/```\w*\n?/g, '').replace(/```/g, '') + '</pre>';
    })
    .replace(/\*\*The principle:\*\*/g, '<strong style="color:#7c3aed">The principle:</strong>')
    .replace(/\*\*Always do this:\*\*/g, '<strong style="color:#16a34a">Always do this:</strong>')
    .replace(/\*\*Never do this again:\*\*/g, '<strong style="color:#dc2626">Never do this again:</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/^(\d+)\. (.+)$/gm, '<li>$1. $2</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\|(.+)\|/g, function(match) {
      const cells = match.split('|').filter(c => c.trim());
      if (cells.every(c => c.trim().match(/^[-:]+$/))) return '';
      const tag = match.includes('---') ? 'th' : 'td';
      return '<tr>' + cells.map(c => '<' + tag + '>' + c.trim() + '</' + tag + '>').join('') + '</tr>';
    })
    .replace(/(<tr>.*<\/tr>\s*)+/g, '<table>$&</table>');
  // Color-code agent names
  html = html.replace(/\b(Orchestrator)\b/g, '<span style="color:#7c3aed;font-weight:600">$1</span>');
  html = html.replace(/\b(Beacon)\b/g, '<span style="color:#d97706;font-weight:600">$1</span>');
  html = html.replace(/\b(Compass)\b/g, '<span style="color:#2563eb;font-weight:600">$1</span>');
  html = html.replace(/\b(Overwatch)\b/g, '<span style="color:#0891b2;font-weight:600">$1</span>');
  html = html.replace(/\b(Polisher)\b/g, '<span style="color:#db2777;font-weight:600">$1</span>');
  html = html.replace(/\b(Retrospector)\b/g, '<span style="color:#16a34a;font-weight:600">$1</span>');
  html = html.replace(/\b(Integrator)\b/g, '<span style="color:#ea580c;font-weight:600">$1</span>');
  html = html.replace(/(\d+)\/10/g, '<span style="font-family:\'Plus Jakarta Sans\',sans-serif;font-weight:800;color:var(--purple)">$1/10</span>');
  return html;
}

function splitRetroSections(md) {
  const sections = [];
  const lines = md.split('\n');
  let current = null;
  for (const line of lines) {
    const h2 = line.match(/^## (.+)/);
    if (h2) {
      if (current) sections.push(current);
      current = { title: h2[1].trim(), lines: [] };
    } else if (current) {
      current.lines.push(line);
    }
  }
  if (current) sections.push(current);
  return sections;
}

function getReviewState(campaignId) {
  return JSON.parse(localStorage.getItem('mc-retro-reviewed-' + campaignId) || '{}');
}
function setReviewState(campaignId, sectionIdx, reviewed) {
  const state = getReviewState(campaignId);
  state[sectionIdx] = reviewed;
  localStorage.setItem('mc-retro-reviewed-' + campaignId, JSON.stringify(state));
}

function getRetroOpenState(campaignId) {
  return JSON.parse(localStorage.getItem('mc-retro-open-' + campaignId) || '{}');
}

async function renderRetro(campaignId) {
  const el = document.getElementById('retro-content-area');
  if (!el) return;
  const md = await loadRetro(campaignId);
  if (!md) { el.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text3)">No retrospective found</div>'; return; }

  const sections = splitRetroSections(md);
  const reviewed = getReviewState(campaignId);
  const totalSections = sections.length;
  const reviewedCount = Object.values(reviewed).filter(Boolean).length;
  const chevronSvg = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let h = '<div class="section-title" style="margin-top:24px">Retrospective <span class="count">' + reviewedCount + '/' + totalSections + ' reviewed</span></div>';

  sections.forEach((s, i) => {
    const isReviewed = reviewed[i];
    const openState = getRetroOpenState(campaignId);
    h += '<div class="retro-section">';
    h += '<div class="retro-header" onclick="toggleRetro(\'' + campaignId + '\',' + i + ')">';
    h += '<span class="retro-dot" style="background:' + (isReviewed ? 'var(--green)' : 'var(--amber)') + '"></span>';
    h += '<span class="retro-title">' + esc(s.title) + '</span>';
    h += '<span class="retro-badge ' + (isReviewed ? 'reviewed' : 'unreviewed') + '">' + (isReviewed ? 'Reviewed' : 'Unreviewed') + '</span>';
    h += '</div>';
    h += '<div class="retro-body' + (openState[i] ? ' open' : '') + '" id="retro-body-' + campaignId + '-' + i + '">';
    h += '<div class="retro-content">' + parseMarkdownBasic(s.lines.join('\n')) + '</div>';
    h += '<div class="retro-actions">';
    if (!isReviewed) {
      h += '<button class="retro-review-btn mark" onclick="markRetroReviewed(\'' + campaignId + '\',' + i + ',true)">Mark as Reviewed</button>';
    } else {
      h += '<button class="retro-review-btn unmark" onclick="markRetroReviewed(\'' + campaignId + '\',' + i + ',false)">Unmark</button>';
    }
    h += '</div></div></div>';
  });

  el.innerHTML = h;
}

function toggleRetro(campaignId, idx) {
  const body = document.getElementById('retro-body-' + campaignId + '-' + idx);
  if (body) {
    body.classList.toggle('open');
    const state = getRetroOpenState(campaignId);
    state[idx] = body.classList.contains('open');
    localStorage.setItem('mc-retro-open-' + campaignId, JSON.stringify(state));
  }
}

function markRetroReviewed(campaignId, idx, reviewed) {
  setReviewState(campaignId, idx, reviewed);
  renderRetro(campaignId);
}

// ── Toast ──
function showToast(msg) {
  let t = document.getElementById('cToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'cToast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1a;color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .25s ease;pointer-events:none;z-index:300';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(80px)'; }, 2000);
}

// ── Notification permission ──
document.addEventListener('click', function once() {
  if (Notification.permission === 'default') Notification.requestPermission();
  document.removeEventListener('click', once);
}, { once: true });

// ── Auto-refresh (5s polling) ──
async function refreshLoop() {
  await load();
}
refreshLoop();
setInterval(refreshLoop, 5000);
</script>
